<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Terrace table set for dinner, placeholder artwork">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4d31"/><stop offset="1" stop-color="#20291a"/>
    </linearGradient>
    <radialGradient id="win" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#f7e6b8"/><stop offset="0.5" stop-color="#e2946f"/>
      <stop offset="1" stop-color="#c65d33" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0e1"/><stop offset="1" stop-color="#e3d5b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#wall)"/>
  <!-- arched window with sunset -->
  <path d="M360 520V260a240 240 0 0 1 480 0v260z" fill="url(#win)"/>
  <path d="M360 520V260a240 240 0 0 1 480 0v260z" fill="none" stroke="#171d12" stroke-width="10"/>
  <line x1="600" y1="120" x2="600" y2="520" stroke="#171d12" stroke-width="8"/>
  <line x1="360" y1="360" x2="840" y2="360" stroke="#171d12" stroke-width="8"/>
  <!-- distant sea line -->
  <rect x="366" y="470" width="468" height="50" fill="#b04e2a" opacity="0.35"/>
  <!-- table -->
  <rect x="0" y="600" width="1200" height="300" fill="url(#linen)"/>
  <rect x="0" y="600" width="1200" height="16" fill="#c9a24b" opacity="0.4"/>
  <!-- plates -->
  <g>
    <ellipse cx="400" cy="720" rx="150" ry="52" fill="#efe5cf" stroke="#b9a075" stroke-width="3"/>
    <ellipse cx="400" cy="720" rx="92" ry="32" fill="#f7f0e1"/>
    <ellipse cx="820" cy="740" rx="150" ry="52" fill="#efe5cf" stroke="#b9a075" stroke-width="3"/>
    <ellipse cx="820" cy="740" rx="92" ry="32" fill="#f7f0e1"/>
  </g>
  <!-- wine glasses -->
  <g stroke="#b9a075" stroke-width="3" fill="#c65d33" fill-opacity="0.28">
    <path d="M610 640c0 40 44 40 44 0z"/><line x1="632" y1="648" x2="632" y2="700"/><line x1="612" y1="702" x2="652" y2="702"/>
    <path d="M980 660c0 40 44 40 44 0z"/><line x1="1002" y1="668" x2="1002" y2="720"/><line x1="982" y1="722" x2="1022" y2="722"/>
  </g>
  <!-- candle -->
  <rect x="150" y="620" width="14" height="80" rx="4" fill="#efe5cf"/>
  <ellipse cx="157" cy="600" rx="12" ry="22" fill="#e2946f"/><circle cx="157" cy="608" r="30" fill="#c9a24b" opacity="0.25"/>
  <!-- rosemary sprig -->
  <g stroke="#3d4d31" stroke-width="4" opacity="0.85"><line x1="700" y1="700" x2="770" y2="770"/></g>
</svg>
