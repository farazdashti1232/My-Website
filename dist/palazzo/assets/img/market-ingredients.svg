    <radialGradient id="key" cx="22%" cy="18%" r="70%"><stop offset="0" stop-color="#f7e6b8" stop-opacity="0.5"/><stop offset="1" stop-color="#f7e6b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="wallbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3823"/><stop offset="1" stop-color="#20291a"/></linearGradient>
